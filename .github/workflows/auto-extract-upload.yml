name: UPS INFINITY ZIP Auto Extract

on:
  workflow_dispatch:

  push:
    paths:
      - 'UPS_INFINITY_PROJECT.zip'
      
permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          mkdir -p temp_extract

          unzip -q UPS_INFINITY_PROJECT.zip -d temp_extract

          PROJECT_DIR="temp_extract/UPS_INFINITY_AI_CREATOR_PRODUCTION_HUB"

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: Project folder not found"
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. .

          rm -rf temp_extract
          rm -f UPS_INFINITY_PROJECT.zip

      - name: Commit Extracted Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Extract UPS INFINITY project"
          git push
